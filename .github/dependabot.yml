version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    ignore:
      # Keep Node types aligned with the project's Node 24 runtime.
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
      # ESLint and TypeScript majors require intentional compatibility migrations.
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      workspace-dependencies:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      github-actions-dependencies:
        patterns:
          - '*'
